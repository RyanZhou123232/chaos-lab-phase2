<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chaos Lab: Critical Transit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game-canvas" width="960" height="640"></canvas>

  <!--
    Classic scripts, not ES modules: modules are blocked when the page is
    opened over file://. Each file defines globals used by the files after
    it, so this order matters:
      config -> input -> entities -> game -> render -> main
  -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
