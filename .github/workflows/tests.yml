name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: node --test

  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Run existing browser check over HTTP
        run: |
          npm install --prefix "$RUNNER_TEMP/hw9-browser" playwright
          export NODE_PATH="$RUNNER_TEMP/hw9-browser/node_modules"
          if command -v google-chrome >/dev/null; then
            export CHROME_PATH="$(command -v google-chrome)"
          else
            node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for try in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
          GAME_URL=http://127.0.0.1:8000/ node tools/browser-check.cjs
